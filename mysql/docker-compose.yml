version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./mysql/config/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped

  newrelic-infra:
    build:
      context: ./newrelic-infra
      dockerfile: Dockerfile
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - ENABLE_PROCESS_METRICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mysql/config/newrelic-mysql-integration.yml:/etc/newrelic-infra/integrations.d/mysql-config.yml:ro
    networks:
      - backend
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped
    
  hr-portal:
    build:
      context: ./hr-portal
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NODE_ENV=production
      - PORT=${HR_PORTAL_PORT}
    ports:
      - "${HR_PORTAL_PORT}:${HR_PORTAL_PORT}"
    mem_limit: 2G
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend
    
  payroll-system:
    build:
      context: ./payroll-system
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NODE_ENV=production
      - PORT=${PAYROLL_SYSTEM_PORT}
    ports:
      - "${PAYROLL_SYSTEM_PORT}:${PAYROLL_SYSTEM_PORT}"
    mem_limit: 2G
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend

  reporting-dashboard:
    build:
      context: ./reporting-dashboard
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NODE_ENV=production
      - PORT=${REPORTING_DASHBOARD_PORT}
    ports:
      - "${REPORTING_DASHBOARD_PORT}:${REPORTING_DASHBOARD_PORT}"
    mem_limit: 2G
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend

  performance-review:
    build:
      context: ./performance-review
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NODE_ENV=production
      - PORT=${PERFORMANCE_REVIEW_PORT}
    ports:
      - "${PERFORMANCE_REVIEW_PORT}:${PERFORMANCE_REVIEW_PORT}"
    mem_limit: 2G
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend

  admin-console:
    build:
      context: ./admin-console
    environment:
      - MYSQL_HOST=mysql-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NODE_ENV=production
      - PORT=${ADMIN_CONSOLE_PORT}
    ports:
      - "${ADMIN_CONSOLE_PORT}:${ADMIN_CONSOLE_PORT}"
    mem_limit: 2G
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - backend

  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    environment:
      - HR_PORTAL_URL=http://hr-portal:${HR_PORTAL_PORT}
      - PAYROLL_SYSTEM_URL=http://payroll-system:${PAYROLL_SYSTEM_PORT}
      - REPORTING_DASHBOARD_URL=http://reporting-dashboard:${REPORTING_DASHBOARD_PORT}
      - PERFORMANCE_REVIEW_URL=http://performance-review:${PERFORMANCE_REVIEW_PORT}
      - ADMIN_CONSOLE_URL=http://admin-console:${ADMIN_CONSOLE_PORT}
    depends_on:
      - hr-portal
      - payroll-system
      - reporting-dashboard
      - performance-review
      - admin-console
    command: run /scripts/load-test.js
    networks:
      - backend

volumes:
  mysql-data:

networks:
  backend:
    driver: bridge
