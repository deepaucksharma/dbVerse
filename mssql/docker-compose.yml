version: "3.9"

services:
  mssql-db:
    build:
      context: ./mssql
      dockerfile: Dockerfile
      args:
        - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
        - NR_INFRA_VERSION=1.58.1
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup
      - ./mssql/init-scripts:/var/opt/mssql/init-scripts
    ports:
      - "${MSSQL_PORT}:1433"
    networks:
      - backend
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' && test -f /var/opt/mssql/status/ready"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    restart: unless-stopped

  admin-console:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    environment:
      - MSSQL_HOST=mssql-db
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DB=AdventureWorks
      - MSSQL_PORT=1433
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME_ADMIN}
      - NODE_ENV=production
      - PORT=3004
      - DB_CONNECTION_RETRIES=5
      - DB_CONNECTION_RETRY_DELAY=5000
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${ADMIN_CONSOLE_PORT}:${ADMIN_CONSOLE_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ADMIN_CONSOLE_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    depends_on:
      mssql-db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  hr-portal:
    build:
      context: ./services/hr
      dockerfile: Dockerfile
    environment:
      - MSSQL_HOST=mssql-db
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DB=AdventureWorks
      - MSSQL_PORT=1433
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME_HR}
      - NODE_ENV=production
      - PORT=${HR_PORTAL_PORT}
      - DB_CONNECTION_RETRIES=5
      - DB_CONNECTION_RETRY_DELAY=5000
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${HR_PORTAL_PORT}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HR_PORTAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    depends_on:
      mssql-db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  payroll-system:
    build:
