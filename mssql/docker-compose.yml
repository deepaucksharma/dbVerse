        max-file: "3"
    restart: unless-stopped

  reporting-dashboard:
    build:
      context: ./services/reporting
      dockerfile: Dockerfile
    environment:
      - MSSQL_HOST=mssql-db
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DB=AdventureWorks
      - MSSQL_PORT=1433
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME_REPORTING}
      - NODE_ENV=production
      - PORT=3002
      - DB_CONNECTION_RETRIES=5
      - DB_CONNECTION_RETRY_DELAY=5000
    ports:
      - "${REPORTING_DASHBOARD_PORT}:${REPORTING_DASHBOARD_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${REPORTING_DASHBOARD_PORT}/health"]
      interval: 10s
      timeout: 5s
