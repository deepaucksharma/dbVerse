      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    depends_on:
      mssql-db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  k6:
    image: grafana/k6
    volumes:
      - ./k6/scripts:/scripts
    environment:
      - HR_PORTAL_URL=${HR_PORTAL_URL}
      - PAYROLL_SYSTEM_URL=${PAYROLL_SYSTEM_URL}
      - REPORTING_DASHBOARD_URL=${REPORTING_DASHBOARD_URL}
      - PERFORMANCE_REVIEW_URL=${PERFORMANCE_REVIEW_URL}
      - ADMIN_CONSOLE_URL=${ADMIN_CONSOLE_URL}
    networks:
      - frontend
    depends_on:
      mssql-db:
        condition: service_healthy
    command: run /scripts/load-test.js

networks:
  frontend:
    name: mssql_frontend
    driver: bridge
  backend:
    name: mssql_backend
    driver: bridge

volumes:
  mssql-data:
    name: mssql_data
    driver: local
